<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Voice Typing</title><style>
*{box-sizing:border-box}body{margin:0;background:#202124;color:#f4f4f4;font:14px Segoe UI,Arial,sans-serif;border:1px solid #555;border-radius:12px;overflow:hidden}.top{height:36px;background:#303134;display:flex;align-items:center;justify-content:space-between;padding:0 10px;-webkit-app-region:drag;font-weight:700}.controls{display:flex;gap:7px;padding:10px;align-items:center}.controls button,.controls select{border:1px solid #555;border-radius:7px;padding:8px;background:#38393c;color:white}.controls button{cursor:pointer}.start{background:#e94363!important;border:0!important;font-weight:700}.status{padding:0 11px;color:#6fffe0;font-size:12px;min-height:18px}.help{padding:5px 11px 10px;color:#bbb;font-size:11px;line-height:1.35}.close{border:0;background:transparent;color:#ddd;font-size:18px;cursor:pointer;-webkit-app-region:no-drag}
